<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased bg-grid relative overflow-x-hidden">

<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface uppercase mb-xs tracking-wider" for="fullName">Full Name</label>
<div class="relative carbon-border border border-outline-variant bg-surface-bright transition-colors duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-transparent border-none py-sm pl-xl pr-sm text-on-surface font-body-md focus:ring-0 placeholder:text-on-surface-variant/50" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Professional Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface uppercase mb-xs tracking-wider" for="email">Professional Email</label>
<div class="relative carbon-border border border-outline-variant bg-surface-bright transition-colors duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>

</div>
</div>
<!-- Organization -->
<div>
<label class="block font-label-md text-label-md text-on-surface uppercase mb-xs tracking-wider" for="organization">Organization</label>
<div class="relative carbon-border border border-outline-variant bg-surface-bright transition-colors duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">domain</span>
<input class="w-full bg-transparent border-none py-sm pl-xl pr-sm text-on-surface font-body-md focus:ring-0 placeholder:text-on-surface-variant/50" id="organization" name="organization" placeholder="Acme Corp" type="text"/>
</div>
</div>
<!-- Master Access Key -->
<div>
<label class="block font-label-md text-label-md text-on-surface uppercase mb-xs tracking-wider" for="accessKey">Master Access Key</label>
<div class="relative carbon-border border border-outline-variant bg-surface-bright transition-colors duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">key</span>
<input class="w-full bg-transparent border-none py-sm pl-xl pr-xl text-on-surface font-body-md focus:ring-0 placeholder:text-on-surface-variant/50" id="accessKey" name="accessKey" placeholder="••••••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-body-lg" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>

<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs text-right">Must be at least 16 characters.</p>

<script>
        // Minimal script for theme toggle interaction demonstration (visual only in this context)
        document.getElementById('themeToggle').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            if (icon.innerText === 'light_mode') {
                icon.innerText = 'dark_mode';
            } else {
                icon.innerText = 'light_mode';
            }
        });
    </script>
