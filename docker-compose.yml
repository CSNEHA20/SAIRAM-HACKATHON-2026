version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-mock_key_for_dev}
      - DB_PATH=/app/database/ecommerce.sqlite
      - CORS_ORIGIN=http://localhost,http://localhost:5173,http://localhost:80
    volumes:
      - ./database:/app/database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
