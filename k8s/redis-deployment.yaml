apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataflow-redis
  namespace: dataflow
  labels:
    app: dataflow-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataflow-redis
  template:
    metadata:
      labels:
        app: dataflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
