apiVersion: v1
kind: ConfigMap
metadata:
  name: dataflow-config
  namespace: dataflow
data:
  CORS_ORIGIN: "http://localhost:3000,http://localhost:5173"
  DB_TYPE: "sqlite"
  DATABASE_PATH: "/app/database/ecommerce.sqlite"
  SESSION_BACKEND: "sqlite"
  SESSION_DB_PATH: "/app/database/sessions.sqlite"
  SESSION_TTL_DAYS: "30"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  MAX_TOOL_ITERATIONS: "8"
  OFFLINE_DEMO_MODE: "true"
  AUTH_ENABLED: "false"
  AUTH_TOKEN_EXPIRE_HOURS: "24"
  RATE_LIMIT_RPM: "0"
