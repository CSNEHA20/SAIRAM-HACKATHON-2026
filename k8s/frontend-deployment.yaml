apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataflow-frontend
  namespace: dataflow
  labels:
    app: dataflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataflow-frontend
  template:
    metadata:
      labels:
        app: dataflow-frontend
    spec:
      containers:
        - name: frontend
          image: dataflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
