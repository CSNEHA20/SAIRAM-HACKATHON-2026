apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dataflow

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - backend-hpa.yaml
  - frontend-hpa.yaml

images:
  - name: dataflow-backend
    newTag: latest
  - name: dataflow-frontend
    newTag: latest
