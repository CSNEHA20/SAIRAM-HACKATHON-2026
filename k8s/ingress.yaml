apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataflow-ingress
  namespace: dataflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: dataflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dataflow-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dataflow-frontend
                port:
                  number: 80
